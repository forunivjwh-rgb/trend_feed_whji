# 매일 새벽 한 번 자동으로: 수집 → 주제 묶기·점수 → 실탐 요약·왜 올랐나 → 피드
# → 저장 파일(SQLite 한 파일)을 data 브랜치에 올리기 → 피드 화면을 GitHub Pages 에 올리기.
# 윈도우·맥 컴퓨터를 켜 두고 돌릴 수 있게 되면 그 컴퓨터의 자동 실행(새벽 04:00)으로 옮기고 이 예약은 끈다.
# 사람이 할 일은 README 의 "GitHub Actions 로 자동 실행" 에 있다.
name: 수집과 피드

on:
  schedule:
    # 하루 한 번, 한국 시간 새벽 04:17 (여기는 UTC 로 적는다: 전날 19:17).
    # 정각은 GitHub 가 붐벼서 자주 늦어지므로 17분으로 비켜 뒀다. 그래도 몇 분~수십 분 늦을 수 있다.
    - cron: "17 19 * * *"
  workflow_dispatch: # Actions 화면의 "Run workflow" 버튼으로 바로 돌릴 수 있게

# 두 실행이 겹쳐 기록이 꼬이지 않게 한 번에 하나만 돈다.
concurrency:
  group: collect
  cancel-in-progress: false

jobs:
  collect:
    name: 수집하고 기록 쌓기
    runs-on: ubuntu-latest
    timeout-minutes: 40
    permissions:
      contents: write # data 브랜치에 기록을 올리려면 필요
      issues: write   # "몰랐는데 흥미로움" 표시 이슈를 읽고 닫으려면 필요
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: 도구 설치 (LLM, 주제 묶기)
        run: pip install --quiet "anthropic>=2,<3" "fastembed>=0.9,<1"

      # 주제 묶기 모델 파일(수백 MB)을 실행마다 받지 않도록 보관해 둔다
      - name: 주제 묶기 모델 보관함
        uses: actions/cache@v4
        with:
          path: ${{ runner.temp }}/fastembed
          key: fastembed-paraphrase-multilingual-MiniLM-L12-v2
          restore-keys: fastembed-

      # 키는 repo Secrets 에서 받아 실행하는 동안만 .env 에 둔다. 이 서버는 끝나면 통째로 지워진다.
      - name: 키를 .env 에 두기
        env:
          YOUTUBE_API_KEY: ${{ secrets.YOUTUBE_API_KEY }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          GITHUB_TOKEN: ${{ github.token }} # 실행마다 새로 나오는 이 repo 전용 토큰(이슈 읽기·닫기용)
        run: |
          : > .env
          printf 'GITHUB_TOKEN=%s\n' "${GITHUB_TOKEN}" >> .env
          if [ -n "${YOUTUBE_API_KEY}" ]; then
            printf 'YOUTUBE_API_KEY=%s\n' "${YOUTUBE_API_KEY}" >> .env
          else
            echo "YOUTUBE_API_KEY 가 Secrets 에 없어 유튜브는 건너뜁니다."
          fi
          if [ -n "${ANTHROPIC_API_KEY}" ]; then
            printf 'ANTHROPIC_API_KEY=%s\n' "${ANTHROPIC_API_KEY}" >> .env
          else
            echo "ANTHROPIC_API_KEY 가 Secrets 에 없어 실탐 요약(LLM)은 건너뜁니다."
          fi

      - name: 수집 · 주제 · 실탐 · 피드 · 기록
        env:
          FASTEMBED_CACHE_PATH: ${{ runner.temp }}/fastembed
        run: bash scripts/actions_run.sh

      - name: 피드 화면을 Pages 용으로 보관
        if: always()
        uses: actions/upload-pages-artifact@v3
        with:
          path: data/feed

  publish:
    name: 피드를 웹 주소에 올리기
    needs: collect
    if: always() && needs.collect.result != 'cancelled'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - id: deploy
        uses: actions/deploy-pages@v4
