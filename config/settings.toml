# 유행 피드 설정 — 숫자와 한도는 전부 이 파일 한 곳에 둔다.
# 값을 바꾸면 다음 실행부터 적용된다. 키(API 키·비밀번호)는 여기 쓰지 않는다(.env 에만).

[general]
timezone = "Asia/Seoul"      # "오늘"을 정하는 기준 시간대
db_path = "data/trend.db"    # 저장 파일(SQLite) 위치. repo 폴더 기준

[schedule]
# 매일 자동으로 시작하는 시각. 명세 샘플과 같은 04:00.
hour = 4
minute = 0

[schedule.windows]
run_missed_asap = true       # 그 시각에 컴퓨터가 꺼져 있었으면 켠 뒤 가능한 한 빨리 돌린다
wake_to_run = false          # 잠든 컴퓨터를 깨워서 돌리지는 않는다
time_limit_hours = 3         # 이 시간을 넘기면 윈도우가 실행을 멈춘다

[http]
timeout_sec = 20             # 한 번 요청하고 기다리는 최대 시간
retries = 2                  # 실패했을 때 다시 시도하는 횟수
backoff_sec = 2.0            # 다시 시도하기 전 쉬는 시간(초). 시도마다 두 배
user_agent = "trend-feed/0.1 (personal daily collector)"

[attention]
# "지금 인기" 잣대 = 하루 증가량 ÷ 그날 그 소스의 가운데(중간값) 항목의 증가량 = "보통의 몇 배"
min_gap_hours = 6            # 이전 기록과 이보다 가까우면 비교하지 않는다
compare_within_days = 3      # 이보다 오래된 이전 기록과는 비교하지 않는다
median_floor = 1.0           # 가운데 값이 이보다 작으면 이 값으로 나눈다(0으로 나누기 방지)

[feed]
path = "data/feed/index.html"   # 피드 페이지를 쓰는 곳. repo 폴더 기준
baseline_days = 14           # 이만큼 쌓이기 전에는 "지금 인기" 모드 (명세 5번)
top_n = 5                    # 맨 위 카드 수
per_source_n = 3             # 분야별 구역에서 소스마다 보여 줄 수
explore_n = 5                # 탐색 슬롯에 무작위로 뽑는 수

[topics]
# 주제 묶기 (명세 5번). 지금은 `python -m trendfeed topics` 로 주제 후보를 보는 데까지만 쓴다.
model = "sentence-transformers/paraphrase-multilingual-MiniLM-L12-v2"  # 작은 다국어 임베딩 모델(무료, 직접 돌림)
threshold = 0.85             # 뜻이 이만큼 비슷해야 같은 주제로 묶는다 (0~1, 1에 가까울수록 거의 같은 뜻)
name_min_chars = 3           # 이름으로 붙일 때, 이보다 짧은 이름은 쓰지 않는다(엉뚱한 글에 걸리지 않게)
name_min_similarity = 0.45   # 제목에 괄호가 붙은(헷갈리는 이름의) 문서는 뜻도 이만큼 비슷해야 붙인다
review_singles = 40          # LLM 검토(이름·합치기·떼어 내기)에 보일, 혼자인 주제의 수(어텐션 큰 순). 묶인 주제는 전부 보인다
merge_min_similarity = 0.6   # LLM이 합치라고 해도, 두 주제의 뜻이 이만큼은 비슷해야 합친다(코드가 확인). 실제 값: 맞는 합치기 0.76~0.84, 틀린 합치기 0.06~0.46

[llm]
# LLM은 Claude API로 부른다. 키는 여기가 아니라 .env (GitHub에서는 Secrets) 의 ANTHROPIC_API_KEY 에 둔다.
# 키가 없으면 LLM을 쓰는 부분(실탐 요약)만 건너뛴다.
model = "claude-haiku-5-5"   # 모델 이름. 바꾸려면 여기만 고친다 (예: "claude-sonnet-5-5")
effort = "low"               # 얼마나 공들여 생각하게 할지: low | medium | high. 높을수록 느리고 비싸다
max_tokens = 4000            # 답 하나의 최대 길이(토큰)

[deepread]
# 실탐(깊게 읽기, 명세 6번). 위에 오른 항목의 원문을 읽고 LLM으로 요약한다.
enabled = true
top_n = 10                   # "지금 인기" 위에서 몇 건을 대상으로 할지
no_reread_days = 7           # 같은 항목은 이 날수 안에 다시 읽지 않는다
budget_minutes = 90          # 하루 실탐에 쓰는 시간 한도
max_chars = 12000            # 글 하나에서 읽는 최대 글자 수(넘으면 앞부분만 읽고 그 사실을 적는다)
min_chars = 200              # 읽은 글이 이보다 짧으면 요약하지 않는다(지어내지 않게)
comments = 20                # Hacker News 댓글 위에서 몇 개 (명세 6번)
pause_sec = 3.0              # 글 하나를 읽고 다음 글을 읽기 전에 쉬는 시간(초)

[sources.hackernews]
enabled = true
label = "Hacker News"
code = "HN"                  # 화면에서 색 점을 고르는 짧은 이름
field = "개발·OSS"
weight = 1.0                 # 어텐션에 곱하는 소스 가중치 (명세 3번)
api_base = "https://hacker-news.firebaseio.com/v0"
limit = 60                   # 하루에 모으는 인기글 수 (명세 3번)
workers = 8                  # 동시에 읽는 글 수
follow_days = 2              # 인기글 목록에서 빠진 글도 이 날수만큼은 숫자를 다시 적는다. 0이면 끔

[sources.github_trending]
enabled = true
label = "GitHub trending"
code = "GH"
field = "개발·OSS"
weight = 1.0
base_url = "https://github.com/trending"
periods = ["daily", "weekly"]   # 일간·주간 목록 합산 (명세 3번)
pause_sec = 2.0              # 목록 페이지 사이에 쉬는 시간(초)

[sources.huggingface]
enabled = true
label = "Hugging Face"
code = "HF"
field = "AI"
weight = 1.0
api_base = "https://huggingface.co/api"
limit = 40                   # 인기 모델 위에서 몇 개 (명세 3번)

[sources.geeknews]
enabled = true
label = "GeekNews"
code = "GN"
field = "한국 IT"
weight = 1.0
feed_url = "https://news.hada.io/rss/news"   # RSS 전체 (명세 3번). 표결이 없어 등장 횟수로 센다

# Wikipedia는 언어판마다 조회수 크기가 달라 소스를 따로 둔다(각자 안에서 "보통의 몇 배"를 잰다).
[sources.wikipedia_ko]
enabled = true
module = "wikipedia"         # 수집 코드는 같은 것을 쓴다
topic_match = "name"         # 주제 묶기: 뜻이 아니라, 문서 이름이 다른 글 제목에 나올 때만 그 주제에 붙인다
label = "Wikipedia (한국어)"
code = "WK"
field = "문화·시사·밈"
weight = 1.0
api_base = "https://wikimedia.org/api/rest_v1/metrics/pageviews/top"
project = "ko.wikipedia"
limit = 100                  # 일간 조회수 위에서 몇 개 (명세 3번)
lookback_days = 3            # 어제 치가 아직 안 나왔으면 며칠 전까지 거슬러 찾는다
pause_sec = 3.0              # 요청 사이에 쉬는 시간(초)

[sources.wikipedia_en]
enabled = true
module = "wikipedia"
topic_match = "name"
label = "Wikipedia (영어)"
code = "WK"
field = "문화·시사·밈"
weight = 1.0
api_base = "https://wikimedia.org/api/rest_v1/metrics/pageviews/top"
project = "en.wikipedia"
limit = 100
lookback_days = 3
pause_sec = 3.0

# 유튜브는 무료 API 키가 필요하다. 키는 여기가 아니라 .env 파일에 YOUTUBE_API_KEY=... 로 둔다.
# 키가 없으면 이 소스만 건너뛰고 나머지는 그대로 돈다.
[sources.youtube]
enabled = true
label = "YouTube 인기 차트"
code = "YT"
field = "영상·숏폼"
weight = 1.0
api_base = "https://www.googleapis.com/youtube/v3"
regions = ["KR"]             # 어느 나라의 인기 차트를 볼지
limit = 250                  # 하루에 모으는 영상 수 (명세 3번). 차트가 그보다 짧으면 있는 만큼
follow_days = 2              # 차트에서 빠진 영상도 이 날수만큼은 숫자를 다시 적는다. 0이면 끔
# 댓글에서 반복되는 말 세기 (명세 4번). 댓글 원문은 저장하지 않고 센 결과만 남긴다.
comments_per_video = 20      # 영상마다 읽는 댓글 수(관련순). 0이면 댓글을 읽지 않는다. 영상 하나에 할당량 1
comment_workers = 8          # 동시에 읽는 영상 수
phrase_min_comments = 3      # 서로 다른 댓글 이만큼에 나와야 "반복되는 말"로 친다
phrase_max_words = 3         # 몇 단어짜리 말까지 볼지
phrase_min_chars = 3         # 이보다 짧은 말은 세지 않는다
phrase_ignore_chars = "ㅋㅎㅠ"  # 이 글자만으로 된 말(ㅋㅋㅋ, ㅎㅎ, ㅠㅠ)은 세지 않는다. 더 빼려면 글자를 추가(예: "ㅋㅎㅠㅜ")
phrase_top = 5               # 영상마다 남기는 말의 수
