# 유행 피드 설정 — 숫자와 한도는 전부 이 파일 한 곳에 둔다.
# 값을 바꾸면 다음 실행부터 적용된다. 키(API 키·비밀번호)는 여기 쓰지 않는다(.env 에만).

[general]
timezone = "Asia/Seoul"      # "오늘"을 정하는 기준 시간대
db_path = "data/trend.db"    # 저장 파일(SQLite) 위치. repo 폴더 기준

[schedule]
# 매일 자동으로 시작하는 시각. 명세 샘플과 같은 04:00.
hour = 4
minute = 0

[schedule.windows]
run_missed_asap = true       # 그 시각에 컴퓨터가 꺼져 있었으면 켠 뒤 가능한 한 빨리 돌린다
wake_to_run = false          # 잠든 컴퓨터를 깨워서 돌리지는 않는다
time_limit_hours = 3         # 이 시간을 넘기면 윈도우가 실행을 멈춘다

[status]
# 소스 상태의 "평소보다 크게 줄면 주의" 기준 (명세 3번 · 9번 열린 항목: 실제 수집량을 본 뒤 정한다).
# 아직 정하지 않았으므로 꺼 둔다(drop_ratio = 0). 정하면 예: 0.5 = 평소의 절반 아래면 "주의".
lookback_days = 7            # 평소 건수 = 지난 이만큼의 날(수집에 성공한 날)의 중앙값
min_days = 3                 # 지난 기록이 이만큼 쌓이기 전에는 이 기준을 쓰지 않는다
drop_ratio = 0               # 0 이면 끔

[http]
timeout_sec = 20             # 한 번 요청하고 기다리는 최대 시간
retries = 2                  # 실패했을 때 다시 시도하는 횟수
backoff_sec = 2.0            # 다시 시도하기 전 쉬는 시간(초). 시도마다 두 배
user_agent = "trend-feed/0.1 (personal daily collector)"

[explore]
# 탐색 슬롯 (명세 2번): 수집 칸의 약 20%는 관심 목록 밖에서 무작위로 뽑는다.
# 목록 밖이 무엇인지는 소스마다 다르다(각 소스 설정의 explore_* 와 README). 탐색 글은 순위 계산에 넣지 않는다.
enabled = true
share = 0.2                  # 전체 수집 중 탐색의 몫. 목록이 N건이면 탐색은 N × 0.2 ÷ 0.8 = N의 25%

[attention]
# "지금 인기" 잣대 = 하루 증가량 ÷ 그날 그 소스의 가운데(중간값) 항목의 증가량 = "보통의 몇 배"
min_gap_hours = 6            # 이전 기록과 이보다 가까우면 비교하지 않는다
compare_within_days = 3      # 이보다 오래된 이전 기록과는 비교하지 않는다
median_floor = 1.0           # 가운데 값이 이보다 작으면 이 값으로 나눈다(0으로 나누기 방지)

[feed]
path = "data/feed/index.html"   # 피드 페이지를 쓰는 곳. repo 폴더 기준
top_n = 5                    # 맨 위 카드 수 (점수 위 4건 + 탐색 1건)
per_field_n = 3              # 분야별 구역에서 분야마다 보여 줄 주제 수 (명세 5번)
items_per_card = 3           # 카드마다 보여 줄 근거 항목 수(대표·발단·최다 논의)
curve_days = 28              # 카드의 어텐션 곡선 길이(날)
# 자리만 두고 아직 연결하지 않은 소스(명세 3번). 수집 상태 표에 빈 칸으로 보인다. [이름, 분야, 메모]
empty_slots = [
  ["Instagram Reels", "영상·숏폼", "마지막 단계(명세 9번 5)에서 켠다"],
  ["Reddit", "", "자리만 둔다"],
  ["X", "", "자리만 둔다"],
  ["LinkedIn", "", "자리만 둔다"],
]

[rollup]
# 롤업(일·주·월 요약, 명세 7번). 기준선 14일이 찬 뒤 피드에 나타난다.
daily_top = 5                # 일: 이 순위 안에 새로 든·밖으로 나간 주제
daily_risers = 3             # 일: 가장 많이 오른 주제 몇 개
weekly_top = 4               # 주: "지속"·"이탈"을 가르는 순위
weekly_n = 5                 # 주: 줄마다 보여 줄 주제 수
new_within_days = 7          # 주: "신규" = 처음 나타난 지 이 날수 안이고
new_top = 8                  #      오늘 이 순위 안
monthly_days = 28            # 월: 곡선 길이(날)
lag_ratio = 0.5              # 월: 각 플랫폼이 자기 최대치의 이 비율을 처음 넘은 날로 시차를 잰다

[score]
# 주제 점수 (명세 5번). 모두 시작값이고 2주 써 본 뒤 조정한다.
baseline_days = 14           # 수집한 날이 이만큼 쌓이기 전에는 "지금 인기" 모드(z·가속 끔, 오늘 어텐션 순)
baseline_max_days = 28       # z 의 기준선: 오늘 이전 최대 이만큼의 날
z_cap = 8                    # z 상한
z_floor = 0.8                # z 분모에 더하는 완충값(평소 변동이 거의 없는 주제에서 z 폭주 방지)
mad_scale = 1.4826           # MAD 를 표준편차와 같은 잣대로 바꾸는 상수
accel_short_days = 3         # 가속: 최근 이만큼의 평균을
accel_long_days = 14         #       이만큼의 평균으로 나눈다(오늘 포함)
accel_weight = 1.5           # 가속 가중
breadth_weight = 0.5         # 플랫폼 폭 가중
threshold = 5.0              # 임계: 이 점수 이상이면 "임계 통과"(실탐 우선 대상)
min_origins = 2              # 출처가 이 수 미만인 주제는 순위에 올리지 않는다("지금 인기" 모드도 같다)
                             # 명세 시작값은 3. 실제 자료에서 3곳 이상이 너무 적어 2로 시작(2026-11-17 사용자 결정, 2주 뒤 다시 조정)
multi_origin_badge = 3       # 출처가 이 수 이상이면 피드에 "여러 곳에서 동시에 뜸" 표시
explore_n = 5                # 탐색 슬롯에 무작위로 뽑는 주제 수 (명세 6번)
explore_skip_top = 20        # 탐색은 순위가 이 위 밖인 주제 중에서 뽑는다(제안)

[topics]
# 주제 묶기 (명세 5번). 지금은 `python -m trendfeed topics` 로 주제 후보를 보는 데까지만 쓴다.
model = "sentence-transformers/paraphrase-multilingual-MiniLM-L12-v2"  # 작은 다국어 임베딩 모델(무료, 직접 돌림)
threshold = 0.85             # 뜻이 이만큼 비슷해야 같은 주제로 묶는다 (0~1, 1에 가까울수록 거의 같은 뜻)
name_min_chars = 3           # 이름으로 붙일 때, 이보다 짧은 이름은 쓰지 않는다(엉뚱한 글에 걸리지 않게)
name_min_similarity = 0.45   # 제목에 괄호가 붙은(헷갈리는 이름의) 문서는 뜻도 이만큼 비슷해야 붙인다
review_singles = 40          # LLM 검토(이름·합치기·떼어 내기)에 보일, 혼자인 주제의 수(어텐션 큰 순). 묶인 주제는 전부 보인다
keywords_n = 4               # 주제 카드에 보일 키워드 수(글 제목에서 코드가 뽑는다, 명세 8번 topics.keywords)
keyword_stopwords = [
  "the", "a", "an", "and", "or", "of", "to", "in", "on", "for", "with", "is", "are", "how", "why", "what",
  "your", "you", "my", "we", "it", "this", "that", "from", "by", "as", "at", "show", "hn", "ask",
  "official", "mv", "video", "shorts", "ep", "vs",
  "그리고", "하는", "있는", "이런", "그런", "진짜", "그냥", "공식", "영상",
]
merge_min_similarity = 0.6   # LLM이 합치라고 해도, 두 주제의 뜻이 이만큼은 비슷해야 합친다(코드가 확인). 실제 값: 맞는 합치기 0.76~0.84, 틀린 합치기 0.06~0.46

[llm]
# LLM은 Claude API로 부른다. 키는 여기가 아니라 .env (GitHub에서는 Secrets) 의 ANTHROPIC_API_KEY 에 둔다.
# 키가 없으면 LLM을 쓰는 부분(실탐 요약)만 건너뛴다.
model = "claude-haiku-5-5"   # 모델 이름. 바꾸려면 여기만 고친다 (예: "claude-sonnet-5-5")
effort = "low"               # 얼마나 공들여 생각하게 할지: low | medium | high. 높을수록 느리고 비싸다
max_tokens = 4000            # 답 하나의 최대 길이(토큰)

[deepread]
# 실탐(깊게 읽기, 명세 6번). 위에 오른 항목의 원문을 읽고 LLM으로 요약한다.
enabled = true
top_n = 10                   # "지금 인기" 모드에서 순위 위 몇 개 주제를 읽을지. 점수 모드에서는 임계 통과 주제를 읽는다
items_per_topic = 3          # 주제마다 대표·발단·최다 논의 중 몇 건까지 읽을지(명세 6번: 1~3건). 요약은 주제마다 LLM 1회
read_explore = true          # 시간 예산이 남으면 탐색 슬롯 주제도 읽는다(명세 6번)
no_reread_days = 7           # 같은 항목은 이 날수 안에 다시 읽지 않는다
budget_minutes = 90          # 하루 실탐에 쓰는 시간 한도
max_chars = 8000             # 글 하나에서 읽는 최대 글자 수(넘으면 앞부분만 읽고 그 사실을 적는다). 주제당 3건까지 읽는다
min_chars = 200              # 읽은 글이 이보다 짧으면 요약하지 않는다(지어내지 않게)
comments = 20                # Hacker News 댓글 위에서 몇 개 (명세 6번)
pause_sec = 3.0              # 글 하나를 읽고 다음 글을 읽기 전에 쉬는 시간(초)
github_issues = 1            # GitHub 저장소는 README와 댓글이 가장 많은 열린 이슈 몇 개를 읽는다(명세 6번 "README, 이슈")

[agent_reach]
# 실탐에서 원문을 읽는 도구(명세 6번). 사용자 포크의 한 커밋으로 고정해 .agent-reach/ 에 따로 설치한다.
# 설치: python -m trendfeed agent-reach install · 점검: python -m trendfeed agent-reach check
# 못 쓰면(설치 안 됨·막힘) 실탐은 각 소스의 공개 주소에서 직접 읽는 방식으로 돌아간다.
enabled = true
repo = "https://github.com/forunivjwh-rgb/Agent-Reach"
commit = "c70ae6da5d39bc90e09ad2ae0575ccc89f31e284"   # 2026-11-08, 버전 1.6.1. 바꾸려면 여기 한 곳만 고친다
home = ".agent-reach"        # 설치 폴더(repo 안, git 에 올리지 않음)
timeout_sec = 120            # 한 번 부를 때 기다리는 최대 시간(초)
# 쓰는 채널. 로그인이 필요한 채널(인스타·레딧·X 등)은 넣지 않는다.
# "web"(HN 링크 원문·모델 카드·위키 본문)은 읽을 주소를 바깥 서비스(Jina·Exa)에 보내므로, 사용자가 정하기 전까지 뺀다.
channels = ["youtube", "github"]
subtitle_langs = "ko,en,ko-orig,en-orig"   # 유튜브 자막 언어(앞쪽을 먼저)
# 이미 알려진 한계 [채널, 오류]. 점검에서 이것만 안 되면 "주의"(노란색)로 두고, 그 밖의 실패만 빨간 × 로 한다.
# 유튜브는 GitHub Actions 서버 주소에 "로봇 아님 확인"을 요구한다(2026-11-17 점검).
known_limits = [["youtube", "PLATFORM_BLOCKED"]]
check_samples = [
  ["youtube", "subtitle", ["https://www.youtube.com/watch?v=jNQXAC9IVRw", "--lang", "en"]],
  ["github", "read", ["yt-dlp/yt-dlp", "--backend", "github-api"]],
]

[feedback]
# "몰랐는데 흥미로움" 표시 (명세 1번 성공 기준). 카드의 링크가 GitHub 이슈를 만들고, 매일 실행이 읽어 기록한다.
enabled = true
title_prefix = "[흥미로움]"  # 이 말로 시작하는, repo 주인이 만든 이슈만 읽는다
repo = ""                    # '소유자/저장소'. 비워 두면 Actions 가 알려 주는 값을 쓴다

[why]
# 주제별 "왜 올랐나" 한 문장 (명세 2번). LLM은 코드가 준 사실만으로 쓰고, 사실에 없는 숫자가 든 문장은 버린다.
enabled = true
top_n = 4                    # 순위 위 몇 개 주제에 쓸지(여기에 Top 5의 탐색 1건이 더해진다)

[sources.hackernews]
enabled = true
label = "Hacker News"
code = "HN"                  # 화면에서 색 점을 고르는 짧은 이름
field = "개발·OSS"
weight = 1.0                 # 어텐션에 곱하는 소스 가중치 (명세 3번)
api_base = "https://hacker-news.firebaseio.com/v0"
limit = 60                   # 하루에 모으는 인기글 수 (명세 3번)
workers = 8                  # 동시에 읽는 글 수
follow_days = 2              # 인기글 목록에서 빠진 글도 이 날수만큼은 숫자를 다시 적는다. 0이면 끔

[sources.github_trending]
enabled = true
label = "GitHub trending"
code = "GH"
field = "개발·OSS"
weight = 1.0
base_url = "https://github.com/trending"
periods = ["daily", "weekly"]   # 일간·주간 목록 합산 (명세 3번)
pause_sec = 2.0              # 목록 페이지 사이에 쉬는 시간(초)
# 탐색: 이 언어들 중 하나(날마다 무작위)의 일간 trending 에서 뽑는다
explore_languages = ["rust", "go", "typescript", "python", "zig", "kotlin", "swift", "c++", "java", "ruby", "elixir", "lua"]

[sources.huggingface]
enabled = true
label = "Hugging Face"
code = "HF"
field = "AI"
weight = 1.0
api_base = "https://huggingface.co/api"
limit = 40                   # 인기 모델 위에서 몇 개 (명세 3번)
explore_pool = 200           # 탐색: 인기 모델 41 ~ 이 순위 안에서 무작위로 뽑는다

[sources.geeknews]
enabled = true
label = "GeekNews"
code = "GN"
field = "한국 IT"
weight = 1.0
feed_url = "https://news.hada.io/rss/news"   # RSS 전체 (명세 3번). 표결이 없어 등장 횟수로 센다

# Wikipedia는 언어판마다 조회수 크기가 달라 소스를 따로 둔다(각자 안에서 "보통의 몇 배"를 잰다).
[sources.wikipedia_ko]
enabled = true
module = "wikipedia"         # 수집 코드는 같은 것을 쓴다
topic_match = "name"         # 주제 묶기: 뜻이 아니라, 문서 이름이 다른 글 제목에 나올 때만 그 주제에 붙인다
label = "Wikipedia (한국어)"
code = "WK"
field = "문화·시사·밈"
weight = 1.0
api_base = "https://wikimedia.org/api/rest_v1/metrics/pageviews/top"
project = "ko.wikipedia"
limit = 100                  # 일간 조회수 위에서 몇 개 (명세 3번)
lookback_days = 3            # 어제 치가 아직 안 나왔으면 며칠 전까지 거슬러 찾는다
pause_sec = 3.0              # 요청 사이에 쉬는 시간(초)

[sources.wikipedia_en]
enabled = true
module = "wikipedia"
topic_match = "name"
label = "Wikipedia (영어)"
code = "WK"
field = "문화·시사·밈"
weight = 1.0
api_base = "https://wikimedia.org/api/rest_v1/metrics/pageviews/top"
project = "en.wikipedia"
limit = 100
lookback_days = 3
pause_sec = 3.0

# 유튜브는 무료 API 키가 필요하다. 키는 여기가 아니라 .env 파일에 YOUTUBE_API_KEY=... 로 둔다.
# 키가 없으면 이 소스만 건너뛰고 나머지는 그대로 돈다.
[sources.youtube]
enabled = true
label = "YouTube 인기 차트"
code = "YT"
field = "영상·숏폼"
weight = 1.0
api_base = "https://www.googleapis.com/youtube/v3"
regions = ["KR"]             # 어느 나라의 인기 차트를 볼지
limit = 250                  # 하루에 모으는 영상 수 (명세 3번). 차트가 그보다 짧으면 있는 만큼
follow_days = 2              # 차트에서 빠진 영상도 이 날수만큼은 숫자를 다시 적는다. 0이면 끔
# 탐색: 다른 카테고리의 인기 차트(17 스포츠, 20 게임, 22 인물·블로그, 23 코미디, 24 엔터테인먼트,
# 25 뉴스·정치, 26 노하우·스타일, 28 과학기술). 비어 있거나 거절되는 카테고리는 건너뛴다
explore_categories = [17, 20, 22, 23, 24, 25, 26, 28]
explore_max_categories = 4   # 하루에 시도할 카테고리 수(카테고리마다 할당량 1)
